<div class="titleAndClose">
  <h2>{{ 'Forgot your username?' | translate }}</h2>
  <button
    mat-icon-button
    class="close-dialog-button"
    (click)="dialogRef.close(false)"
    tabindex="-1"
    type="button"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>
<p>{{ 'You can request your username using your e-mail address!' | translate }}</p>

<app-outlined-input type="text" autocompleteHint="email" [formField]="mailForm" />

<button
  mat-flat-button
  type="submit"
  color="primary"
  [disabled]="mailForm().invalid()"
  (click)="trySubmit()"
>
  {{ 'Send e-mail' | translate }}
</button>

<app-combined-form-errors [form]="mailForm" />
