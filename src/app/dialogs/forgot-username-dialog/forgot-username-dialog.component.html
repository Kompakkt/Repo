<div class="titleAndClose">
  <h2>{{ 'forgot-username-dialog-title' | fluent }}</h2>
  <button
    mat-icon-button
    class="close-dialog-button"
    (click)="dialogRef.close(false)"
    tabindex="-1"
    type="button"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>
<p>{{ 'forgot-username-dialog-hint' | fluent }}</p>

<app-outlined-input type="text" autocompleteHint="email" [formField]="mailForm" />

<button
  mat-flat-button
  type="submit"
  color="primary"
  [disabled]="mailForm().invalid()"
  (click)="trySubmit()"
>
  {{ 'forgot-username-dialog-submit' | fluent }}
</button>

<app-combined-form-errors [form]="mailForm" />
