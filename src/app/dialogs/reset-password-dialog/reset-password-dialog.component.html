<h3>{{ 'Choose a new password' | translate }}</h3>

<app-outlined-input type="text" autocompleteHint="username" [formField]="form.username" />

<app-outlined-input type="password" autocompleteHint="new-password" [formField]="form.password" />

<app-outlined-input
  type="password"
  autocompleteHint="new-password"
  [formField]="form.passwordRepeat"
/>

<div class="bottom-row">
  <button
    mat-stroked-button
    color="accent"
    type="submit"
    [disabled]="form().invalid()"
    (click)="trySubmit()"
  >
    {{ 'Change your password' | translate }}
  </button>
</div>

<app-combined-form-errors [form]="form" [kinds]="['serverError', 'notEqual']" />
