<h2>
  @if (existing) {
    <span>{{ 'create-or-edit-compilation-title-edit' | fluent }}</span>
  } @else {
    <span>{{ 'create-or-edit-compilation-title-create' | fluent }}</span>
  }
  <button mat-icon-button mat-dialog-close>
    <mat-icon class="material-symbols-outlined">close</mat-icon>
  </button>
</h2>

<app-outlined-input
  [formField]="compilationForm.name"
  type="text"
  [label]="'create-or-edit-compilation-name-label' | fluent"
  [placeholder]="'create-or-edit-compilation-name-placeholder' | fluent"
/>

<app-outlined-input
  [formField]="compilationForm.description"
  type="textarea"
  [label]="'create-or-edit-compilation-description-label' | fluent"
  [placeholder]="'create-or-edit-compilation-description-placeholder' | fluent"
/>

<div class="actions">
  <button mat-stroked-button mat-dialog-close>{{ 'button-cancel' | fluent }}</button>
  <button mat-flat-button (click)="save()" color="primary">{{ 'button-save' | fluent }}</button>
</div>
