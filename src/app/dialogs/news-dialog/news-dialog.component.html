<h2>
  @if (existing()) {
    <span>{{ 'Edit news item' | translate }}</span>
  } @else {
    <span>{{ 'Create news item' | translate }}</span>
  }
  <button mat-icon-button mat-dialog-close>
    <mat-icon class="material-symbols-outlined">close</mat-icon>
  </button>
</h2>

<div class="dialog-content">
  <div class="form-section">
    <app-outlined-input
      type="text"
      [formField]="newsForm.title"
      placeholder="News title"
      label="Title"
    />
    <app-outlined-input
      type="text"
      [formField]="newsForm.content"
      [placeholder]="`News content (max ${this.maxContentLength()} characters)`"
      label="Content"
      rows="4"
    />
    <app-outlined-input
      type="text"
      [formField]="newsForm.link"
      placeholder="https://..."
      label="Link"
    />

    <app-outlined-input
      type="text"
      [formField]="newsForm.imageUrl"
      placeholder="Image URL or upload a file"
      label="Image"
    >
      <div inputSuffix>
        <input type="file" accept="image/*" (change)="onImageSelected($event)" hidden #fileInput />

        @if (newsForm.imageUrl().value(); as imageUrl) {
          @if (imageUrl.length > 0) {
            <button mat-icon-button type="button" (click)="clearImage()" matTooltip="Clear image">
              <mat-icon class="material-symbols-outlined">clear</mat-icon>
            </button>
          }
        } @else {
          <button mat-icon-button type="button" (click)="triggerFileInput()">
            @if (isUploading()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              <mat-icon class="material-symbols-outlined">upload</mat-icon>
            }
          </button>
        }
      </div>
    </app-outlined-input>

    <app-outlined-input type="text" [value]="dateString()" placeholder="News date" label="Date">
      <input
        type="text"
        [matDatepicker]="picker"
        (dateChange)="onDateSelect($event)"
        style="
          position: absolute;
          bottom: 16px;
          right: 24px;
          display: inline;
          width: 0px;
          padding: 0px;
          margin: 0px;
          height: 0px;
          visibility: 0;
          appearance: unset;
          outline: unset;
          border: unset;
        "
      />
      <mat-datepicker-toggle inputSuffix [for]="picker" />
    </app-outlined-input>
    <mat-datepicker #picker (change)="onDateSelect($event)" />

    <mat-slide-toggle [formField]="newsForm.published">
      {{ 'Published' | translate }}
    </mat-slide-toggle>
  </div>

  <div class="preview-section">
    <h3>{{ 'Live preview' | translate }}</h3>
    <app-news-card [newsItem]="previewItem()" [isPreview]="true" />
  </div>
</div>

<div class="actions">
  <button mat-stroked-button mat-dialog-close>{{ 'Cancel' | translate }}</button>
  <button mat-flat-button (click)="save()" color="primary" [disabled]="newsForm().invalid()">
    {{ 'Save' | translate }}
  </button>
</div>

<app-combined-form-errors [form]="newsForm" />
