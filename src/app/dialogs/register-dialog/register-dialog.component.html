<div class="titleAndClose">
  <h3>{{ 'register-dialog-title' | fluent }}</h3>
  <button
    mat-icon-button
    class="close-dialog-button"
    (click)="dialogRef.close(false)"
    tabindex="-1"
    type="button"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<app-outlined-input
  [formField]="form.mail"
  [label]="'register-dialog-mail-label' | fluent"
  autofillHint="email"
/>

@if (form.mail().touched()) {
  <app-combined-form-errors [form]="form" [kinds]="['email']" />
}

<app-outlined-input
  [formField]="form.prename"
  [label]="'register-dialog-prename-label' | fluent"
  autofillHint="given-name"
  type="text"
/>

<app-outlined-input
  [formField]="form.surname"
  [label]="'register-dialog-surname-label' | fluent"
  autofillHint="last-name"
  type="text"
/>

<app-outlined-input
  [formField]="form.username"
  [label]="'register-dialog-username-label' | fluent"
  autofillHint="username"
  type="text"
/>

<app-outlined-input
  [formField]="form.password"
  [label]="'register-dialog-password-label' | fluent"
  autofillHint="new-password"
  type="password"
/>

<app-outlined-input
  [formField]="form.passwordRepeat"
  [label]="'register-dialog-password-repeat-label' | fluent"
  autofillHint="new-password"
  type="password"
/>

<app-combined-form-errors [form]="form" [kinds]="['serverError', 'notEqual']" />

<div class="register-btn">
  <button
    mat-flat-button
    type="submit"
    color="primary"
    (click)="trySubmit()"
    [disabled]="form().invalid() || form().submitting()"
  >
    {{ 'register-dialog-submit' | fluent }}
  </button>
</div>
<p>
  {{ 'register-dialog-has-account-hint' | fluent }}
  <a href="javascript:void(0)" (click)="openAuthDialog()">{{
    'register-dialog-login-link' | fluent
  }}</a>
</p>
