<div class="titleAndClose">
  <h3>{{ 'Register' | fluent }}</h3>
  <button
    mat-icon-button
    class="close-dialog-button"
    (click)="dialogRef.close(false)"
    tabindex="-1"
    type="button"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<app-outlined-input
  [formField]="form.mail"
  [label]="'E-Mail address' | fluent"
  autofillHint="email"
/>

@if (form.mail().touched()) {
  <app-combined-form-errors [form]="form" [kinds]="['email']" />
}

<app-outlined-input
  [formField]="form.prename"
  [label]="'First name' | fluent"
  autofillHint="given-name"
  type="text"
/>

<app-outlined-input
  [formField]="form.surname"
  [label]="'Last name' | fluent"
  autofillHint="last-name"
  type="text"
/>

<app-outlined-input
  [formField]="form.username"
  [label]="'Username' | fluent"
  autofillHint="username"
  type="text"
/>

<app-outlined-input
  [formField]="form.password"
  [label]="'Password' | fluent"
  autofillHint="new-password"
  type="password"
/>

<app-outlined-input
  [formField]="form.passwordRepeat"
  [label]="'Repeat password' | fluent"
  autofillHint="new-password"
  type="password"
/>

<app-combined-form-errors [form]="form" [kinds]="['serverError', 'notEqual']" />

<div class="register-btn">
  <button
    mat-flat-button
    type="submit"
    color="primary"
    (click)="trySubmit()"
    [disabled]="form().invalid() || form().submitting()"
  >
    {{ 'Create new account' | fluent }}
  </button>
</div>
<p>
  {{ 'Already have an account?' | fluent }}
  <a href="javascript:void(0)" (click)="openAuthDialog()">{{ 'Login' | fluent }}</a>
</p>
