<div class="titleAndClose">
  <h2>{{ 'Forgot your password?' | translate }}</h2>
  <button
    mat-icon-button
    class="close-dialog-button"
    (click)="dialogRef.close(false)"
    tabindex="-1"
    type="button"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<p>
  {{ 'You can request your password using your username and will receive a mail!' | translate }}
</p>

<app-outlined-input
  type="text"
  autocompleteHint="username"
  [formField]="usernameForm"
  [label]="'Enter your username' | translate"
/>

<button
  mat-flat-button
  type="submit"
  color="primary"
  [disabled]="usernameForm().invalid()"
  (click)="trySubmit()"
>
  {{ 'Submit password request' | translate }}
</button>

<app-combined-form-errors [form]="usernameForm" />
