<div class="titleAndClose">
  <h2>{{ 'forgot-password-dialog-title' | fluent }}</h2>
  <button
    mat-icon-button
    class="close-dialog-button"
    (click)="dialogRef.close(false)"
    tabindex="-1"
    type="button"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<p>
  {{ 'forgot-password-dialog-hint' | fluent }}
</p>

<app-outlined-input
  type="text"
  autocompleteHint="username"
  [formField]="usernameForm"
  [label]="'forgot-password-dialog-username-label' | fluent"
/>

<button
  mat-flat-button
  type="submit"
  color="primary"
  [disabled]="usernameForm().invalid()"
  (click)="trySubmit()"
>
  {{ 'forgot-password-dialog-submit' | fluent }}
</button>

<app-combined-form-errors [form]="usernameForm" />
