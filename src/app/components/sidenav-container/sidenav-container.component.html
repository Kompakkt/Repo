@if (sidenav.state(); as state) {
  <div class="sidenav-backdrop" [class.visible]="state.opened" (click)="close()"></div>
  <div class="sidenav-content" [class.opened]="state.opened">
    <h3 #reference>
      @if (titleSignal(); as title) {
        <span>
          {{ title() | fluent }}
          @if (badgeCountSignal(); as badgeCount) {
            @if (badgeCount() > 0) {
              <span class="option-count-badge">{{ badgeCount() }}</span>
            }
          }
        </span>
      }
      <button mat-icon-button>
        <mat-icon (click)="close()">close</mat-icon>
      </button>
    </h3>
  </div>
}
