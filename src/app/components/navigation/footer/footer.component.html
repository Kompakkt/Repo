<div class="left">
  @if (customCopyRightText(); as text) {
    <span>{{ text }}</span>
  } @else {
    <span>&copy; 2018-{{ currentYear }} Kompakkt</span>
  }

  <a href="https://kompakkt.github.io/Documentation/" target="_blank" rel="noopener noreferrer">
    {{ 'User Documentation' | fluent }}
  </a>
</div>

<a href="https://kompakkt.github.io/Info" target="_blank" rel="noopener noreferrer">
  <img
    class="footer-icon"
    src="assets/icons/github-logo.svg"
    [alt]="'Kompakkt on Github - Landing Page' | fluent"
  />
</a>

<div class="right">
  <a routerLink="/about">{{ 'About' | fluent }}</a>
  <a routerLink="/imprint">{{ 'Imprint' | fluent }}</a>
  <a routerLink="/privacy">{{ 'Privacy Policy' | fluent }}</a>
  <a href="https://www.tib.eu/en/terms-of-use" target="_blank" rel="noopener noreferrer">
    {{ 'Terms of Use' | fluent }}
  </a>
  <a routerLink="/consortium">{{ 'Consortium' | fluent }}</a>

  <div
    extendSlot="language-dropdown"
    slotBehavior="replace"
    style="margin-left: auto; padding: 0px 12px"
  >
    <app-language-dropdown />
  </div>
</div>
