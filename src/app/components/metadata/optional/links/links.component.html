<div>
  <p [class]="isPhysical() ? 'metadata-header-physical' : 'metadata-header-digital'">
    {{ 'links-heading' | fluent }}
  </p>
  <app-outlined-input
    type="text"
    [label]="'links-description-label' | fluent"
    [placeholder]="'links-description-placeholder' | fluent"
    [formField]="tupleForm.description"
  />
  <app-outlined-input
    type="text"
    [label]="'links-url-label' | fluent"
    [placeholder]="'links-url-placeholder' | fluent"
    [formField]="tupleForm.value"
  />
</div>
<div class="meta-button">
  <button
    mat-flat-button
    color="primary"
    [disabled]="tupleForm().invalid()"
    (click)="addNewLinkData()"
  >
    {{ 'button-add' | fluent }}
  </button>
</div>

@if (!isPhysical()) {
  <mat-divider />
}

<app-optional-card-list [(entity)]="entity" propertyType="externalLink" />
