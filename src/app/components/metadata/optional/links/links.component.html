<div>
  <p [class]="isPhysical() ? 'metadata-header-physical' : 'metadata-header-digital'">
    {{ 'External links' | fluent }}
  </p>
  <app-outlined-input
    type="text"
    [label]="'Description' | fluent"
    [placeholder]="'Enter a description' | fluent"
    [formField]="tupleForm.description"
  />
  <app-outlined-input
    type="text"
    [label]="'URL' | fluent"
    [placeholder]="'Enter an URL' | fluent"
    [formField]="tupleForm.value"
  />
</div>
<div class="meta-button">
  <button
    mat-flat-button
    color="primary"
    [disabled]="tupleForm().invalid()"
    (click)="addNewLinkData()"
  >
    {{ 'Add' | fluent }}
  </button>
</div>

@if (!isPhysical()) {
  <mat-divider />
}

<app-optional-card-list [(entity)]="entity" propertyType="externalLink" />
