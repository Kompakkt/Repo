<p [class]="isPhysical() ? 'metadata-header-physical' : 'metadata-header-digital'">
  {{ 'external-ids-heading' | fluent }}
</p>
<app-outlined-input
  type="text"
  [label]="'external-ids-type-label' | fluent"
  [placeholder]="'external-ids-type-placeholder' | fluent"
  [formField]="tupleForm.type"
/>
<app-outlined-input
  type="text"
  [label]="'external-ids-value-label' | fluent"
  [placeholder]="'external-ids-value-placeholder' | fluent"
  [formField]="tupleForm.value"
/>

<div class="meta-button">
  <button
    mat-flat-button
    color="primary"
    [disabled]="tupleForm().invalid()"
    (click)="addNewIdentifier()"
  >
    {{ 'button-add' | fluent }}
  </button>
</div>

@if (!isPhysical()) {
  <mat-divider />
}

<app-optional-card-list [(entity)]="entity" propertyType="externalId" />
