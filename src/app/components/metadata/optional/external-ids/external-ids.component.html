<p [class]="isPhysical() ? 'metadata-header-physical' : 'metadata-header-digital'">
  {{ 'External identifiers' | translate }}
</p>
<app-outlined-input
  type="text"
  [label]="'Type (e.g. DOI) ' | translate"
  [placeholder]="'Enter a type' | translate"
  [formField]="tupleForm.type"
/>
<app-outlined-input
  type="text"
  [label]="'Value' | translate"
  [placeholder]="'Enter a value' | translate"
  [formField]="tupleForm.value"
/>

<div class="meta-button">
  <button
    mat-flat-button
    color="primary"
    [disabled]="tupleForm().invalid()"
    (click)="addNewIdentifier()"
  >
    {{ 'Add' | translate }}
  </button>
</div>

@if (!isPhysical()) {
  <mat-divider />
}

<app-optional-card-list [(entity)]="entity" propertyType="externalId" />
