<div>
  <p class="metadata-header-digital">{{ 'Creation' | fluent }}</p>
  <app-outlined-input
    type="text"
    [label]="'Add technique (e.g. Laserscan or Modelling)' | fluent"
    [formField]="creationForm.technique"
  />
  <app-outlined-input
    type="text"
    [label]="'Add program' | fluent"
    [formField]="creationForm.software"
  />
  <app-outlined-input
    type="text"
    [label]="'Add equipment' | fluent"
    [formField]="creationForm.equipment"
  />

  <app-outlined-input
    type="text"
    [label]="'Add creation date range' | fluent"
    [formField]="dateRangeForm"
    (input)="onDateInput($event)"
  >
    <mat-datepicker-toggle inputSuffix [for]="picker" />
  </app-outlined-input>

  <div class="material-date-input">
    <mat-date-range-input [rangePicker]="picker">
      <input matStartDate [formField]="creationForm.start" />
      <input matEndDate [formField]="creationForm.end" />
    </mat-date-range-input>
  </div>
  <mat-date-range-picker #picker xPosition="start" yPosition="below" />

  <div class="meta-button">
    <button
      mat-flat-button
      color="primary"
      [disabled]="creationForm().invalid()"
      (click)="addNewCreationData()"
    >
      {{ 'Add' | fluent }}
    </button>
  </div>

  <mat-divider />

  <app-optional-card-list [(entity)]="entity" propertyType="creation" />
</div>
