<div>
  <p [class]="isPhysical() ? 'metadata-header-physical' : 'metadata-header-digital'">
    {{ 'biblio-ref-heading' | fluent }}
  </p>

  <!-- ToDo: Add Icon-Button inside Input -->
  <app-outlined-input
    type="text"
    [label]="'biblio-ref-description-label' | fluent"
    [placeholder]="'biblio-ref-description-placeholder' | fluent"
    [formField]="biblioRefForm.description"
  >
    @if (isPrefilled()) {
      <button inputSuffix class="editButton" (click)="onEditData('description')">
        <mat-icon color="primary">edit</mat-icon>
      </button>
    }
  </app-outlined-input>

  <app-outlined-input
    type="text"
    [label]="'biblio-ref-reference-label' | fluent"
    [placeholder]="'biblio-ref-reference-placeholder' | fluent"
    [formField]="biblioRefForm.reference"
  >
    @if (isPrefilled()) {
      <button inputSuffix class="editButton" (click)="onEditData('reference')">
        <mat-icon color="primary">edit</mat-icon>
      </button>
    }
  </app-outlined-input>
</div>
<div class="meta-button">
  <button mat-stroked-button color="primary" (click)="resetFormFields()">
    {{ 'biblio-ref-clear-button' | fluent }}
  </button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="biblioRefForm().invalid()"
    (click)="!isPrefilled() ? addNewBiblioData() : updateMetadata()"
  >
    {{ (isPrefilled() ? 'biblio-ref-update-button' : 'button-add') | fluent }}
  </button>
</div>

@if (!isPhysical()) {
  <mat-divider />
}

<app-optional-card-list
  [(entity)]="entity"
  propertyType="biblioRefs"
  (selected)="selectForEdit($event)"
/>
