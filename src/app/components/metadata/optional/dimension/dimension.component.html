<div>
  <p class="metadata-header-physical">{{ 'dimension-heading' | fluent }}</p>
  <app-outlined-input
    type="text"
    [label]="'dimension-unit-description-label' | fluent"
    [placeholder]="'dimension-unit-description-placeholder' | fluent"
    [formField]="dimensionForm.name"
  />

  <div class="form-row">
    <app-outlined-input
      type="text"
      [label]="'dimension-unit-value-label' | fluent"
      [placeholder]="'dimension-unit-value-placeholder' | fluent"
      [formField]="dimensionForm.value"
    />
    <app-outlined-input
      type="text"
      [label]="'dimension-unit-type-label' | fluent"
      [placeholder]="'dimension-unit-type-placeholder' | fluent"
      [formField]="dimensionForm.type"
    />
  </div>
</div>

<div class="meta-button">
  <button
    mat-flat-button
    color="primary"
    [disabled]="dimensionForm().invalid()"
    (click)="addNewDimensionData()"
  >
    {{ 'button-add' | fluent }}
  </button>
</div>

<app-optional-card-list [(entity)]="entity" propertyType="dimensions" />
