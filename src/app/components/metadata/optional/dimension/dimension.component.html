<div>
  <p class="metadata-header-physical">{{ 'Dimension' | translate }}</p>
  <app-outlined-input
    type="text"
    [label]="'Unit description (e.g. Width of base)' | translate"
    [placeholder]="'Enter a description' | translate"
    [formField]="dimensionForm.name"
  />

  <div class="form-row">
    <app-outlined-input
      type="text"
      [label]="'Unit value' | translate"
      [placeholder]="'Enter a value' | translate"
      [formField]="dimensionForm.value"
    />
    <app-outlined-input
      type="text"
      [label]="'Unit type' | translate"
      [placeholder]="'Enter a type' | translate"
      [formField]="dimensionForm.type"
    />
  </div>
</div>

<div class="meta-button">
  <button
    mat-flat-button
    color="primary"
    [disabled]="dimensionForm().invalid()"
    (click)="addNewDimensionData()"
  >
    {{ 'Add' | translate }}
  </button>
</div>

<app-optional-card-list [(entity)]="entity" propertyType="dimensions" />
