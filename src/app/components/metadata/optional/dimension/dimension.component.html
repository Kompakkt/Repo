<div>
  <p class="metadata-header-physical">{{ 'Dimension' | fluent }}</p>
  <app-outlined-input
    type="text"
    [label]="'Unit description (e.g. Width of base)' | fluent"
    [placeholder]="'Enter a description' | fluent"
    [formField]="dimensionForm.name"
  />

  <div class="form-row">
    <app-outlined-input
      type="text"
      [label]="'Unit value' | fluent"
      [placeholder]="'Enter a value' | fluent"
      [formField]="dimensionForm.value"
    />
    <app-outlined-input
      type="text"
      [label]="'Unit type' | fluent"
      [placeholder]="'Enter a type' | fluent"
      [formField]="dimensionForm.type"
    />
  </div>
</div>

<div class="meta-button">
  <button
    mat-flat-button
    color="primary"
    [disabled]="dimensionForm().invalid()"
    (click)="addNewDimensionData()"
  >
    {{ 'Add' | fluent }}
  </button>
</div>

<app-optional-card-list [(entity)]="entity" propertyType="dimensions" />
