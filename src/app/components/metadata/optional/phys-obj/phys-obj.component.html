<p class="metadata-header-digital">{{ 'Reference Object' | translate }}</p>
<app-general [entity]="entity()" />

<app-dimension [entity]="entity()"></app-dimension>

<p class="metadata-header-physical">
  {{ 'Place' | translate }}
</p>
<app-outlined-input
  type="text"
  name="name"
  label="{{ 'Name' | translate }}"
  placeholder="{{ 'Enter a name' | translate }}"
  [(ngModel)]="entity().place.name"
  required
/>
<app-outlined-input
  type="text"
  name="geopolarea"
  label="{{ 'Geopolicital area' | translate }}"
  placeholder="{{ 'Enter a geopolitical area' | translate }}"
  [(ngModel)]="entity().place.geopolarea"
/>

<app-address class="margin-top" [address]="entity().place.address" [isPhysicalObject]="true" />

<app-agents [(entity)]="entity" [isPhysicalObject]="true" />

<app-external-ids [entity]="entity()" />

<app-links [entity]="entity()" />

<app-biblio-ref [entity]="entity()" />

<app-metadata-files [entity]="entity()" />
