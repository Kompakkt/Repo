<div class="address-form">
  <app-outlined-input
    type="text"
    [label]="'Country' | fluent"
    [placeholder]="'Enter a country' | fluent"
    [formField]="addressForm.country"
  />

  <app-outlined-input
    type="text"
    [label]="'Postal Code' | fluent"
    [placeholder]="'Enter a postal code' | fluent"
    [formField]="addressForm.postcode"
  />

  <app-outlined-input
    type="text"
    [label]="'City' | fluent"
    [placeholder]="'Enter a city' | fluent"
    [formField]="addressForm.city"
  />

  <app-outlined-input
    type="text"
    [label]="'Street' | fluent"
    [placeholder]="'Enter a street' | fluent"
    [formField]="addressForm.street"
  />

  <app-outlined-input
    type="text"
    [label]="'Number' | fluent"
    [placeholder]="'Enter a number' | fluent"
    [formField]="addressForm.number"
  />

  <app-outlined-input
    type="text"
    [label]="'Building' | fluent"
    [placeholder]="'Enter a building' | fluent"
    [formField]="addressForm.building"
  />
</div>
