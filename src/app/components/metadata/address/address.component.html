<div class="address-form">
  <app-outlined-input
    type="text"
    [label]="'address-country-label' | fluent"
    [placeholder]="'address-country-placeholder' | fluent"
    [formField]="addressForm.country"
  />

  <app-outlined-input
    type="text"
    [label]="'address-postal-code-label' | fluent"
    [placeholder]="'address-postal-code-placeholder' | fluent"
    [formField]="addressForm.postcode"
  />

  <app-outlined-input
    type="text"
    [label]="'address-city-label' | fluent"
    [placeholder]="'address-city-placeholder' | fluent"
    [formField]="addressForm.city"
  />

  <app-outlined-input
    type="text"
    [label]="'address-street-label' | fluent"
    [placeholder]="'address-street-placeholder' | fluent"
    [formField]="addressForm.street"
  />

  <app-outlined-input
    type="text"
    [label]="'address-number-label' | fluent"
    [placeholder]="'address-number-placeholder' | fluent"
    [formField]="addressForm.number"
  />

  <app-outlined-input
    type="text"
    [label]="'address-building-label' | fluent"
    [placeholder]="'address-building-placeholder' | fluent"
    [formField]="addressForm.building"
  />
</div>
