<div class="address-form">
  <app-outlined-input
    type="text"
    [label]="'Country' | translate"
    [placeholder]="'Enter a country' | translate"
    [formField]="addressForm.country"
  />

  <app-outlined-input
    type="text"
    [label]="'Postal Code' | translate"
    [placeholder]="'Enter a postal code' | translate"
    [formField]="addressForm.postcode"
  />

  <app-outlined-input
    type="text"
    [label]="'City' | translate"
    [placeholder]="'Enter a city' | translate"
    [formField]="addressForm.city"
  />

  <app-outlined-input
    type="text"
    [label]="'Street' | translate"
    [placeholder]="'Enter a street' | translate"
    [formField]="addressForm.street"
  />

  <app-outlined-input
    type="text"
    [label]="'Number' | translate"
    [placeholder]="'Enter a number' | translate"
    [formField]="addressForm.number"
  />

  <app-outlined-input
    type="text"
    [label]="'Building' | translate"
    [placeholder]="'Enter a building' | translate"
    [formField]="addressForm.building"
  />
</div>
