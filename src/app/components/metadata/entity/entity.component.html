<mat-sidenav-container>
  <mat-sidenav opened mode="side">
    <mat-action-list>
      <button
        mat-list-item
        (click)="selectTab(generalTab)"
        [class.active-tab]="generalTab.isActive"
      >
        <mat-icon
          [matTooltip]="'Section contains required fields' | translate"
          [color]="generalComponent.generalForm().valid() ? 'primary' : 'accent'"
          class="required-info"
        >
          label_important
        </mat-icon>
        {{ tabLabels.General | translate }}
      </button>
      <button
        mat-list-item
        (click)="selectTab(licenceTab)"
        [class.active-tab]="licenceTab.isActive"
      >
        <mat-icon
          [matTooltip]="'Section contains required fields' | translate"
          [color]="licenceComponent.licenceForm().valid() ? 'primary' : 'accent'"
          class="required-info"
        >
          label_important
        </mat-icon>
        {{ tabLabels.Licence | translate }}
      </button>

      <button mat-list-item (click)="selectTab(agentsTab)" [class.active-tab]="agentsTab.isActive">
        <mat-icon
          [matTooltip]="'Section contains required fields' | translate"
          [color]="agentsComponent.agentsForm().valid() ? 'primary' : 'accent'"
          class="required-info"
        >
          label_important
        </mat-icon>

        <span>{{ tabLabels.RelatedAgents | translate }}</span>
      </button>
      <mat-divider class="expansion-divider" />
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <p class="optional-text">{{ 'Optional metadata:' | translate }}</p>
        </mat-expansion-panel-header>
        <button
          mat-list-item
          (click)="selectTab(creationTab)"
          [class.active-tab]="creationTab.isActive"
        >
          <mat-icon color="primary" class="required-info"> label_important </mat-icon>
          <span>{{ tabLabels.Creation | translate }}</span>
          <app-optional-count [count]="entity().creation.length" />
        </button>

        <button
          mat-list-item
          (click)="selectTab(identifiersTab)"
          [class.active-tab]="identifiersTab.isActive"
        >
          <mat-icon color="primary" class="required-info"> label_important </mat-icon>
          <span>{{ tabLabels.Identifiers | translate }}</span>
          <app-optional-count [count]="entity().externalId.length" />
        </button>

        <button mat-list-item (click)="selectTab(linksTab)" [class.active-tab]="linksTab.isActive">
          <mat-icon color="primary" class="required-info"> label_important </mat-icon>
          <span>{{ tabLabels.Links | translate }}</span>
          <app-optional-count [count]="entity().externalLink.length" />
        </button>
        <button
          mat-list-item
          (click)="selectTab(biblioRefsTab)"
          [class.active-tab]="biblioRefsTab.isActive"
        >
          <mat-icon color="primary" class="required-info"> label_important </mat-icon>
          <span>{{ tabLabels.BiblioRefs | translate }}</span>
          <app-optional-count [count]="entity().biblioRefs.length" />
        </button>
        <button
          mat-list-item
          (click)="selectTab(metadataFilesTab)"
          [class.active-tab]="metadataFilesTab.isActive"
        >
          <mat-icon color="primary" class="required-info"> label_important </mat-icon>
          <span>{{ tabLabels.MetadataFiles | translate }}</span>
          <app-optional-count [count]="entity().metadata_files.length" />
        </button>
        <button
          mat-list-item
          (click)="selectTab(phyEntityTab)"
          [class.active-tab]="phyEntityTab.isActive"
        >
          <mat-icon
            [color]="phyEntityComponent.isNonEmptyAndValidOrIsEmpty() ? 'primary' : 'accent'"
          >
            label_important
          </mat-icon>
          <span>{{ tabLabels.ReferenceObject | translate }}</span>
          @if (
            phyEntityComponent.isNonEmptyAndValidOrIsEmpty() &&
            phyEntityComponent.physicalEntityForm().touched()
          ) {
            <app-optional-count [count]="1" />
          }
        </button>
      </mat-expansion-panel>
    </mat-action-list>
  </mat-sidenav>
  <mat-sidenav-content class="content">
    <mat-tab-group
      #tabGroup
      [selectedIndex]="selectedTabIndex()"
      animationDuration="0ms"
      dynamicHeight
    >
      <mat-tab #generalTab [label]="tabLabels.General">
        <app-general
          #generalComponent
          [(entity)]="entity"
          (remove)="removeValueFromProperty($event)"
        />
      </mat-tab>

      <mat-tab #licenceTab [label]="tabLabels.Licence">
        <app-licence #licenceComponent [(entity)]="entity" />
      </mat-tab>

      <mat-tab #agentsTab [label]="tabLabels.RelatedAgents">
        <app-agents #agentsComponent [(entity)]="entity" />
      </mat-tab>

      <mat-tab #creationTab [label]="tabLabels.Creation">
        <app-creation [(entity)]="entity" />
      </mat-tab>

      <mat-tab #identifiersTab [label]="tabLabels.Identifiers">
        <app-external-ids [(entity)]="entity" />
      </mat-tab>

      <mat-tab #linksTab [label]="tabLabels.Links">
        <app-links [(entity)]="entity" />
      </mat-tab>

      <mat-tab #biblioRefsTab [label]="tabLabels.BiblioRefs">
        <app-biblio-ref [(entity)]="entity" />
      </mat-tab>

      <mat-tab #metadataFilesTab [label]="tabLabels.MetadataFiles">
        <app-metadata-files [(entity)]="entity" />
      </mat-tab>

      <mat-tab #phyEntityTab [label]="tabLabels.ReferenceObject">
        <app-phys-obj #phyEntityComponent [(entity)]="entity" />
      </mat-tab>
    </mat-tab-group>
  </mat-sidenav-content>
</mat-sidenav-container>
